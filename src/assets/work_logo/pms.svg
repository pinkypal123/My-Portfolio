<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">PMS Process Management System</title>
  <desc id="description">Professional PMS wordmark with a connected workflow icon.</desc>
  <defs>
    <linearGradient id="icon-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="line-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#f8fafc"/>
  <circle cx="600" cy="337" r="245" fill="#eef2ff"/>
  <g filter="url(#shadow)">
    <rect x="202" y="215" width="246" height="246" rx="58" fill="url(#icon-gradient)"/>
    <path d="M276 293h52c18 0 32 14 32 32v10m0 0h44m-44 0v34c0 18-14 32-32 32h-10m-42-34h-12"
      fill="none" stroke="url(#line-gradient)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="263" y="274" width="40" height="40" rx="12" fill="#fff"/>
    <rect x="347" y="316" width="40" height="40" rx="12" fill="#fff"/>
    <rect x="263" y="378" width="40" height="40" rx="12" fill="#fff"/>
    <circle cx="360" cy="401" r="15" fill="#67e8f9"/>
  </g>

  <text x="498" y="337" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="700" letter-spacing="3">PMS</text>
  <rect x="504" y="367" width="396" height="6" rx="3" fill="url(#icon-gradient)"/>
  <text x="502" y="416" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" letter-spacing="2">PROCESS MANAGEMENT</text>
  <text x="502" y="453" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" letter-spacing="2">SYSTEM</text>
</svg>
